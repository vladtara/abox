# MLflow Tracing -- https://mlflow.org/docs/latest/genai/tracing/
#
# Receives GenAI traces from genai-collector (releases/genai-collector.yaml)
# over OTLP/HTTP at /v1/traces; MLflow has no OTLP/gRPC receiver. Each span
# batch must carry x-mlflow-experiment-id, and there is no header to pick an
# experiment by name, so the mlflow-experiments Job below creates them in a
# fixed order and fails if the IDs are not the ones the collector sends.
#
#   kubectl port-forward -n mlflow svc/mlflow 5000:5000
apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mlflow
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/mlflow/charts/mlflow
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: mlflow
spec:
  interval: 1h
  releaseName: mlflow
  chartRef:
    kind: OCIRepository
    name: mlflow
    namespace: flux-system
  # The 290MB image took 3m43s to pull next to otel-demo's, past the 5m
  # default wait, and a failed install is not retried by default.
  timeout: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  # The chart exposes no probe settings, so both probes run on the Kubernetes
  # default timeoutSeconds: 1. /health shares the event loop with /v1/traces
  # ingestion, and a SQLite write can hold it past 1s, so kubelet restarts a
  # healthy pod (upstream feat/otel-demo, da74135). "add" because the
  # rendered probes carry no timeoutSeconds for "replace" to find.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
                value: 5
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 5
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 5
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/name=mlflow
  values:
    fullnameOverride: mlflow
    # The chart defaults to v<appVersion>-full (3.14.0), which adds the ML
    # training libraries a tracking server never imports. 3.16 is the newest
    # release and translates OpenLLMetry, OpenInference, GenAI semconv and
    # Google ADK attributes on ingested spans.
    image:
      tag: v3.16.1
    storage:
      enabled: true
    mlflow:
      backendStoreUri: "sqlite:////mlflow/mlflow.db"
      defaultArtifactRoot: "mlflow-artifacts:/"
      artifactsDestination: "/mlflow/artifacts"
    server:
      flag_options:
        - serve_artifacts
      value_options:
        # Replaces MLflow's default allowlist (localhost and literal private
        # IPs), so localhost stays in for port-forward. The Host header keeps
        # its port, and an entry only matches other ports if it has a "*".
        allowed-hosts: "mlflow.mlflow.svc.cluster.local,mlflow.mlflow.svc.cluster.local:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
        workers: 2
    # Flat ~1.85Gi RSS in this cluster, not growing with traffic: eight Python
    # processes of 230-250Mi each (server, two uvicorn workers, four huey job
    # consumers, job runner). At a 2Gi limit one `kubectl exec ... python`
    # beside them OOMKilled the pod.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 3Gi
---
# SQLite hands out experiment IDs in creation order: Default is 0, so kagent
# gets 1 and astronomy-shop 2 on a fresh volume. Safe to re-run, it only checks
# once they exist. If the PVC is replaced and the IDs shift, this fails and
# genai-collector's x-mlflow-experiment-id headers need updating.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-experiments
  namespace: mlflow
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create
          image: curlimages/curl:8.16.0
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              api=http://mlflow.mlflow.svc.cluster.local:5000/api/2.0/mlflow/experiments
              curl -sf --retry 30 --retry-delay 5 --retry-all-errors \
                http://mlflow.mlflow.svc.cluster.local:5000/health
              for pair in kagent:1 astronomy-shop:2; do
                name=${pair%%:*}; want=${pair##*:}
                curl -s -X POST -H 'content-type: application/json' \
                  -d "{\"name\": \"$name\"}" "$api/create" >/dev/null
                got=$(curl -sf "$api/get-by-name?experiment_name=$name" \
                  | sed -n 's/.*"experiment_id": *"\([0-9]*\)".*/\1/p')
                echo "$name -> $got"
                [ "$got" = "$want" ] || { echo "genai-collector expects $want"; exit 1; }
              done
